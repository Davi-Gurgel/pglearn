services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pagila
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs only when the volume is empty (first start).
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
