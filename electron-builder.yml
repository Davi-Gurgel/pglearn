appId: dev.davigurgel.pglearn
productName: pglearn
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - LICENSE
asar: true
npmRebuild: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  icon: build/icon.png
  minimumSystemVersion: "13.0"
  identity: null
  notarize: false
artifactName: "${productName}-${version}-${arch}.${ext}"
dmg:
  title: "pglearn ${version}"
publish: null
